source = ~/.config/omarchy/current/theme/hyprlock.conf

# BACKGROUND
background {
  monitor =
  #path = screenshot
  path = ~/.config/omarchy/current/background
  #color = $background
  blur_passes = 1
  # contrast = 1
  brightness = 0.5
  # vibrancy = 0.2
  # vibrancy_darkness = 0.2
}

general {
  ignore_empty_input = true
}

# INPUT FIELD
input-field {
  monitor =
  size = 250, 60
  # outline_thickness = 2
  outline_thickness = 0
  dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
  dots_spacing = 0.4 # Scale of dots' absolute size, 0.0 - 1.0
  dots_center = true
  outer_color = rgba(ffffffff)        # full white
  inner_color = rgba(ffffff40)        # faded white
  font_color = rgba(ffffffff)         # full white
  check_color = rgba(ff0000ff)        # solid red
  font_family = JetBrainsMono Nerd Font
  placeholder_text = <span> Enter Password 󰈷 </span>
  fade_on_empty = false
  rounding = -1
  hide_input = false
  position = 0, -100
  halign = center
  valign = center
}

# DATE
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = rgb(cdd6f4)
  font_size = 22
  font_family = JetBrainsMono Nerd Font
  position = -105, 65
  halign = right
  valign = bottom
}

# TIME
label {
  monitor = 
  # 24 hour
  # text = cmd[update:1000] echo "$(date +"%-H:%M")"
  # 12 hour am/pm
  text = cmd[update:1000] echo "$(date +"%-I:%M %p")"
  color = rgb(cdd6f4)
  font_size = 95
  font_family = JetBrainsMono Nerd Font
  position = -100, 70
  halign = right
  valign = bottom
}

Profile Picture
image {
  monitor =
  path = /home/user/Downloads/user.png 
  size = 200
  # border_size = 2
  border_size = 0
  border_color = rgba(ffffffff)
  position = 0, 60
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:1000] echo "welcome back, $(whoami)"
  color = rgb(cdd6f4)
  font_size = 14
  font_family = JetBrainsMono Nerd Font
  position = 0, -170
  halign = center
  valign = center
}


