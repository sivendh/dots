# ┌──────────────────────────────────────────────────────┐
# │  HYPRLOCK MUSIC VISUALIZER V2 — Modern Floating Pill │
# │  A premium glassmorphic music widget with album art, │
# │  scrolling title, artist, progress bar, and time.    │
# └──────────────────────────────────────────────────────┘

# ═══════════════════════════════════════════════════════
# WIDGET BACKDROP — Frosted glass pill
# ═══════════════════════════════════════════════════════
shape {
    monitor =
    size = 460, 120
    color = rgba(25, 23, 36, 0.65)
    rounding = 24
    border_size = 1
    border_color = rgba(110, 106, 134, 0.35)
    xray = true
    position = 0, 130
    halign = center
    valign = bottom
}

# Inner glow accent line (top edge highlight)
shape {
    monitor =
    size = 420, 2
    color = rgba(196, 167, 231, 0.25)
    rounding = 1
    border_size = 0
    position = 0, 187
    halign = center
    valign = bottom
}

# ═══════════════════════════════════════════════════════
# ALBUM ART — Rounded square on the left
# ═══════════════════════════════════════════════════════
image {
    monitor =
    path =
    size = 86
    rounding = 16
    border_size = 2
    border_color = rgba(196, 167, 231, 0.30)
    reload_time = 1
    reload_cmd = ~/.config/scripts/hyprlock-music-v2.sh --art
    position = -167, 130
    halign = center
    valign = bottom
}

# ═══════════════════════════════════════════════════════
# PLAYER SOURCE ICON — Top-right of the widget
# ═══════════════════════════════════════════════════════
label {
    monitor =
    text = cmd[update:2000] ~/.config/scripts/hyprlock-music-v2.sh --player-icon
    color = rgba(144, 140, 170, 0.7)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 205, 178
    halign = center
    valign = bottom
}

# ═══════════════════════════════════════════════════════
# TRACK TITLE — Bold, scrolling
# ═══════════════════════════════════════════════════════
label {
    monitor =
    text = cmd[update:1000] ~/.config/scripts/hyprlock-music-v2.sh --title
    color = rgba(224, 222, 244, 0.95)
    font_size = 15
    font_family = JetBrainsMono Nerd Font Bold
    position = 30, 173
    halign = center
    valign = bottom
}

# ═══════════════════════════════════════════════════════
# ARTIST — Muted, smaller
# ═══════════════════════════════════════════════════════
label {
    monitor =
    text = cmd[update:1000] ~/.config/scripts/hyprlock-music-v2.sh --artist
    color = rgba(144, 140, 170, 0.85)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 30, 152
    halign = center
    valign = bottom
}

# ═══════════════════════════════════════════════════════
# PROGRESS BAR — Pango-colored with handle
# ═══════════════════════════════════════════════════════
label {
    monitor =
    text = cmd[update:1000] ~/.config/scripts/hyprlock-music-v2.sh --progress-bar
    text_align = center
    color = rgba(224, 222, 244, 0.9)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 20, 128
    halign = center
    valign = bottom
}

# ═══════════════════════════════════════════════════════
# TIME — Position / Duration
# ═══════════════════════════════════════════════════════
label {
    monitor =
    text = cmd[update:1000] ~/.config/scripts/hyprlock-music-v2.sh --time
    color = rgba(110, 106, 134, 0.75)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 180, 128
    halign = center
    valign = bottom
}

# ═══════════════════════════════════════════════════════
# STATUS ICON — Play/Pause between art and title
# ═══════════════════════════════════════════════════════
label {
    monitor =
    text = cmd[update:1000] ~/.config/scripts/hyprlock-music-v2.sh --status
    color = rgba(196, 167, 231, 0.85)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = -110, 152
    halign = center
    valign = bottom
}
