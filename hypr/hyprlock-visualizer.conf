# GLASSY MUSIC PLAYER
shape {
    monitor =
    size = 440, 110
    color = rgba(255, 255, 255, 0.1)
    rounding = 20
    border_size = 2
    border_color = rgba(255, 255, 255, 0.2)
    xray = true
    position = 0, 120
    halign = center
    valign = bottom
}

# ALBUM ART
image {
    monitor =
    path = /tmp/hyprlock_art.png
    size = 80
    rounding = 15
    border_size = 0
    position = -160, 120
    halign = center
    valign = bottom
}

# PLAYER ICON
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/music_info.sh --player-icon
    color = rgba(255, 255, 255, 0.6)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = -110, 155
    halign = center
    valign = bottom
}

# TITLE
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/music_info.sh --title
    color = rgba(255, 255, 255, 0.9)
    font_size = 14
    font_family = JetBrainsMono Nerd Font Bold
    position = 60, 165
    halign = center
    valign = bottom
}

# ARTIST
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/music_info.sh --artist
    color = rgba(255, 255, 255, 0.7)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 60, 145
    halign = center
    valign = bottom
}

# PROGRESS BAR (Version 1: Working)
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/music_info.sh --progress
    color = rgba(255, 255, 255, 0.8)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 60, 120
    halign = center
    valign = bottom
}

