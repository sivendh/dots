# ALBUM ART UPDATER (Invisible)
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/music_info.sh --update-art
    color = rgba(0, 0, 0, 0)
    position = 0, 0
    halign = left
    valign = top
}
